    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            width: 100vw;
            min-height: 100vh;
            cursor: pointer;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* STATIC GRIT / TEXTURE OVERLAY */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('Airbrush-IMAGE-ENHANCER-1786522159771-1786522159771.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }
        
        /* Master layout boundaries */
        .main-layout {
            width: 100%;
            max-width: 800px;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            min-height: 85vh;
        }

        /* Hard locks navigation links to the left side wall */
        .icon-stack {
            display: flex;
            flex-direction: column;
            gap: 45px;
            width: 100%;
            align-items: flex-start;
        }

        /* Clicking the row will slide it smoothly left to right */
        .social-row {
            display: flex;
            align-items: center;
            justify-content: center; /* Initially centered */
            width: 100%;
            text-decoration: none;
            transition: transform 0.25s ease;
        }
        
        .social-row:hover {
            transform: scale(1.05);
        }

        /* HARDTEKK SPIN LINK ANIMATION IMPLEMENTATION */
        .custom-icon {
            width: 55px;
            height: auto;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Spinning animation toggle class handled by event routing */
        .social-row.clicked-spinning .custom-icon {
            transform: rotate(360deg) scale(1.2);
        }

        .social-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #444444; 
            margin-left: 0;
            opacity: 0;
            width: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: opacity 0.6s ease 0.2s, margin-left 0.5s cubic-bezier(0.25, 1, 0.5, 1), width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* ON REVEAL FLIGHT EFFECTS: Locks items all the way to the far left wall */
        body.activated .social-row {
            justify-content: flex-start;
        }

        body.activated .social-text {
            width: 150px;      
            margin-left: 20px;  
            opacity: 1;         
        }

        .social-text.copied-flash {
            color: #00ff66 !important;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        /* NATIVE EQUALIZER FREQUENCY LAYOUT FOOTPRINT */
        .visualizer-wrapper {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-top: auto; 
            padding-top: 30px;
        }

        .wave-bar {
            width: 3.5%;
            height: 3px;
            background-color: #222222;
            border-radius: 2px;
            transition: height 0.05s linear, background-color 0.3s ease;
        }

        body.activated .wave-bar {
            background-color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        audio { display: none; }
    </style>
</head>

                body.classList.add('activated');
                startHardtekkVisualizerLoop();

            if (audio.paused) {
                audio.play();
            }

            visInterval = setInterval(() => {

                        // Simulates high intensity speed kicks synchronized to rhythmic timing scales
                        let timeScale = Date.now() * 0.015;
                        let baseBass = Math.sin(timeScale + index * 0.5) * 15;
                        
                        // Hard sub bass transient thump emulation
                        let hardtekkKick = (Math.sin(timeScale * 1.5) > 0.6) ? Math.floor(Math.random() * 38) + 10 : 0;
                        
                        let targetHeight = Math.max(3, Math.abs(baseBass) + hardtekkKick);
                        bar.style.height = `${targetHeight}px`;
                    });
                } else {
                    waveBars.forEach(bar => bar.style.height = '3px');
                }
            }, 65); // Hyper responsive updating frame speed metric
        }

        audio.play().then(() => {
            body.classList.add('activated');
            startHardtekkVisualizerLoop();

            console.log("Awaiting system interaction parameter validation checks.");

            navigator.clipboard.writeText(discordUsername);

                discordText.textContent = "Copied!";

            }, 300);

            setTimeout(() => {
                discordText.textContent = "Discord";

                discordBtn.classList.remove('clicked-spinning');
            }, 2000);
        });
