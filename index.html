<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexter334-gov</title>
    <style>
        /* Makes the entire page completely blank white */
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            cursor: pointer; /* Changes mouse to a pointer so users know to click */
        }
        /* Completely hides the visual audio player box from the screen */
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Hidden Audio File -->
    <audio id="bg-audio" autoplay loop>
        <source src="ACIDTEKK%20(Slowed).mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-audio');

        // Attempt automatic playback as soon as the page structure loads
        audio.play().catch(() => {
            console.log("Browser blocked autoplay. Waiting for user to click the screen.");
        });

        // The moment the user clicks anywhere on the white screen, force the music to play
        document.body.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
            }
        });
    </script>

</body>
</html>
