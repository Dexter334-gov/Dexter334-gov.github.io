<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexter334-gov</title>
    <style>
        /* Resets all default browser margins */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff;
            width: 100vw;
            min-height: 100vh;
            cursor: pointer; /* Keeps the click cue active */
            overflow-x: hidden; /* Prevents unwanted sideways scrolling */
        }
        /* Style for your top banner image */
        .banner-img {
            width: 100%;       /* Forces it to touch left and right borders */
            height: 250px;     /* Set height - change this number to make it taller/shorter */
            object-fit: cover; /* Prevents distorting/stretching the photo details */
            display: block;    /* Removes default bottom gaps */
        }
        /* Completely hides the visual audio player box from the screen */
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Your Banner Image at the top -->
    <img src="images%20(2).jpeg" alt="Banner" class="banner-img">

    <!-- Hidden Audio File -->
    <audio id="bg-audio" autoplay loop>
        <source src="ACIDTEKK%20(Slowed).mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-audio');

        // Attempt automatic playback as soon as the page structure loads
        audio.play().catch(() => {
            console.log("Browser blocked autoplay. Waiting for user to click the screen.");
        });

        // The moment the user clicks anywhere on the screen, force the music to play
        document.body.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
            }
        });
    </script>

</body>
</html>
