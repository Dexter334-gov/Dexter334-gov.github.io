<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Dexter334-gov</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { background-color: #000000; width: 100vw; min-height: 100vh; cursor: pointer; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; position: relative; } /* STATIC GRIT BACKGROUND TEXTURE */ body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: url('Airbrush-IMAGE-ENHANCER-1786522159771-1786522159771.jpg'); background-size: cover; background-position: center; opacity: 0.15; z-index: 1; pointer-events: none; } /* Layout Boundary Container */ .main-layout { width: 100%; max-width: 800px; padding: 60px 40px; display: flex; flex-direction: column; position: relative; z-index: 2; min-height: 85vh; } /* Navigation links stack panel mapping */ .icon-stack { display: flex; flex-direction: column; gap: 45px; width: 100%; } /* Center start configuration layout profiles */ .social-row { display: flex; align-items: center; justify-content: center; width: 100%; text-decoration: none; transition: transform 0.2s ease; } .social-row:hover { transform: scale(1.05); } /* Spin transition metrics rules */ .custom-icon { width: 55px; height: auto; display: block; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); } .social-row.clicked-spinning .custom-icon { transform: rotate(360deg) scale(1.2); } /* Matte gray text hidden parameters layout */ .social-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 600; letter-spacing: 1px; color: #444444; margin-left: 0; opacity: 0; width: 0; overflow: hidden; white-space: nowrap; transition: opacity 0.6s ease 0.2s, margin-left 0.5s cubic-bezier(0.25, 1, 0.5, 1), width 0.5s cubic-bezier(0.25, 1, 0.5, 1); } /* FLY OUT TO LEFT ACTIVATION INTERACTION: Forces content to left wall margins */ body.activated .social-row { justify-content: flex-start !important; } body.activated .social-text { width: 150px; margin-left: 20px; opacity: 1; } .social-text.copied-flash { color: #00ff66 !important; text-shadow: 0 0 8px rgba(0, 255, 102, 0.4); } /* EQUALIZER STACK HOOKS CONTAINER FOOTPRINT */ .visualizer-wrapper { width: 100%; height: 60px; display: flex; align-items: flex-end; justify-content: space-between; margin-top: auto; padding-top: 30px; } .wave-bar { width: 3.5%; height: 3px; background-color: #222222; border-radius: 2px; transition: height 0.05s linear, background-color 0.3s ease; } body.activated .wave-bar { background-color: #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.4); } audio { display: none; } </style> </head> <body> <div class="main-layout"> <!-- Social link content section stack area --> <div class="icon-stack"> <!-- DISCORD --> <div class="social-row" id="discord-btn" title="Click to copy username"> <img src="image-removebg-preview.png" alt="Discord" class="custom-icon"> <span class="social-text" id="discord-text">Discord</span> </div> <!-- INSTAGRAM --> <div class="social-row" id="insta-btn" title="Instagram"> <img src="image-removebg-preview%20(1).png" alt="Instagram" class="custom-icon"> <span class="social-text">Instagram</span> </div> <!-- ROBLOX --> <div class="social-row" id="roblox-btn" title="Roblox"> <img src="image-removebg-preview%20(2).png" alt="Roblox" class="custom-icon"> <span class="social-text">Roblox</span> </div> <!-- COOKIE CLICKER GAME LINK --> <div class="social-row" id="cookie-game-btn" title="Play Cookie Clicker"> <img src="Cookie.png" alt="Cookie Clicker" class="custom-icon"> <span class="social-text">Cookie Game</span> </div> </div> <!-- Audio Frequency wave visual bars nodes spectrum layout --> <div class="visualizer-wrapper" id="visualizer-wave"> <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div> <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div> <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div> <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div> <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div> </div> </div> <!-- Hidden audio tracking track component player element --> <audio id="bg-audio" autoplay loop> <source src="ACIDTEKK%20(Slowed).mp3" type="audio/mpeg"> </audio> <script> const audio = document.getElementById('bg-audio'); const body = document.body; const waveBars = document.querySelectorAll('.wave-bar'); const discordUsername = "dextermogger0746"; function activatePage() { if (!body.classList.contains('activated')) { body.classList.add('activated'); startHardtekkVisualizerLoop(); } if (audio.paused) { audio.play(); } } // Hardtekk high-intensity dynamic beat sync tracking engine loop script logic let visInterval; function startHardtekkVisualizerLoop() { if (visInterval) return; visInterval = setInterval(() => { if (!audio.paused) { waveBars.forEach((bar, index) => { let timeScale = Date.now() * 0.015; let baseBass = Math.sin(timeScale + index * 0.5) * 15; // Hard warehouse kick transient beat wave spike triggers let hardtekkKick = (Math.sin(timeScale * 1.5) > 0.6) ? Math.floor(Math.random() * 38) + 12 : 0; let targetHeight = Math.max(3, Math.abs(baseBass) + hardtekkKick); bar.style.height = `${targetHeight}px`; }); } else { waveBars.forEach(bar => bar.style.height = '3px'); } }, 65); } // Check auto initialization parameter parameters safely audio.play().then(() => { body.classList.add('activated'); startHardtekkVisualizerLoop(); }).catch(() => { console.log("Interaction check pipeline holding active engine context components."); }); body.addEventListener('click', activatePage); // BUTTON CLICK NAVIGATION TIMELINE ROUTING ACTIONS // DISCORD COPY const discordBtn = document.getElementById('discord-btn'); const discordText = document.getElementById('discord-text'); discordBtn.addEventListener('click', (e) => { e.stopPropagation(); activatePage(); discordBtn.classList.add('clicked-spinning'); navigator.clipboard.writeText(discordUsername); setTimeout(() => { discordText.textContent = "Copied!"; discordText.classList.add('copied-flash'); }, 300); setTimeout(() => { discordText.textContent = "Discord"; discordText.classList.remove('copied-flash'); discordBtn.classList.remove('clicked-spinning'); }, 2000); }); // INSTAGRAM ROUTER const instaBtn = document.getElementById('insta-btn'); instaBtn.addEventListener('click', (e) => { e.stopPropagation(); activatePage(); instaBtn.classList.add('clicked-spinning'); setTimeout(() => { instaBtn.classList.remove('clicked-spinning'); window.open("https://instagram.com", "_blank"); }, 600); }); // ROBLOX ROUTER const robloxBtn = document.getElementById('roblox-btn'); robloxBtn.addEventListener('click', (e) => { e.stopPropagation(); activatePage(); robloxBtn.classList.add('clicked-spinning'); setTimeout(() => { robloxBtn.classList.remove('clicked-spinning'); window.open("https://roblox.com", "_blank"); }, 600); }); // COOKIE CLICKER ROUTER const cookieGameBtn = document.getElementById('cookie-game-btn'); cookieGameBtn.addEventListener('click', (e) => { e.stopPropagation(); activatePage(); cookieGameBtn.classList.add('clicked-spinning'); setTimeout(() => { cookieGameBtn.classList.remove('clicked-spinning'); window.open("https://github.io", "_blank"); }, 600); }); </script> </body> </html>
