<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexter334-gov</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            width: 100vw;
            min-height: 100vh;
            cursor: pointer;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* STATIC GRIT / TEXTURE OVERLAY */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('Airbrush-IMAGE-ENHANCER-1786522159771-1786522159771.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }
        
        /* Layout formatting box container wrapper */
        .main-layout {
            width: 100%;
            max-width: 800px;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            min-height: 80vh;
        }

        /* Container for the left vertical stack of links */
        .icon-stack {
            display: flex;
            flex-direction: column;
            gap: 45px;
            width: 100%;
        }

        /* The row structure containing icon + text */
        .social-row {
            display: flex;
            align-items: center;
            justify-content: center; /* Starts perfectly centered */
            width: 100%;
            text-decoration: none;
            transition: transform 0.25s ease;
        }
        
        .social-row:hover {
            transform: scale(1.05);
        }

        .custom-icon {
            width: 55px;
            height: auto;
            display: block;
        }

        .social-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #444444; 
            margin-left: 0;
            opacity: 0;
            width: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: opacity 0.6s ease 0.2s, margin-left 0.5s cubic-bezier(0.25, 1, 0.5, 1), width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* ACTIVATION SYSTEM: Drives icons straight to the far-left screen wall boundary */
        body.activated .social-row {
            justify-content: flex-start;
        }

        body.activated .social-text {
            width: 150px;      
            margin-left: 20px;  
            opacity: 1;         
        }

        .social-text.copied-flash {
            color: #00ff66 !important;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        /* CUSTOM AUDIO VISUALIZER WAVE CONTAINER */
        .visualizer-wrapper {
            width: 100%;
            height: 50px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-top: auto; /* Attaches the spectrum bars safely at the screen bottom layout footprint */
            padding-top: 30px;
        }

        .wave-bar {
            width: 3.5%;
            height: 3px;
            background-color: #222222; /* Dim idle state color */
            border-radius: 2px;
            transition: height 0.08s ease, background-color 0.3s ease;
        }

        body.activated .wave-bar {
            background-color: #00ff66; /* Changes to pure glowing Matrix Green */
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }

        audio { display: none; }
    </style>
</head>
<body>

    <div class="main-layout">

        <!-- Social Icons Stack Area -->
        <div class="icon-stack">
            <!-- DISCORD -->
            <div class="social-row" id="discord-btn" title="Click to copy username">
                <img src="image-removebg-preview.png" alt="Discord" class="custom-icon">
                <span class="social-text" id="discord-text">Discord</span>
            </div>

            <!-- INSTAGRAM -->
            <a href="https://instagram.com" target="_blank" class="social-row" title="Instagram">
                <img src="image-removebg-preview%20(1).png" alt="Instagram" class="custom-icon">
                <span class="social-text">Instagram</span>
            </a>

            <!-- ROBLOX -->
            <a href="https://roblox.com" target="_blank" class="social-row" title="Roblox">
                <img src="image-removebg-preview%20(2).png" alt="Roblox" class="custom-icon">
                <span class="social-text">Roblox</span>
            </a>
        </div>

        <!-- The Audio Visualizer Waves (Now built with 20 responsive layout bars) -->
        <div class="visualizer-wrapper" id="visualizer-wave">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>

    </div>

    <!-- Background Audio Asset -->
    <audio id="bg-audio" autoplay loop>
        <source src="ACIDTEKK%20(Slowed).mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-audio');
        const body = document.body;
        const waveBars = document.querySelectorAll('.wave-bar');

        const discordUsername = "dextermogger0746";

        function activatePage() {
            if (!body.classList.contains('activated')) {
                body.classList.add('activated');
                startWaveAnimation();
            }
            if (audio.paused) {
                audio.play();
            }
        }

        // Independent animation loop that triggers high-intensity updates sync'd to Hardtekk timing
        let waveInterval;
        function startWaveAnimation() {
            if (waveInterval) return;
            waveInterval = setInterval(() => {
                if (!audio.paused) {
                    waveBars.forEach((bar, index) => {
                        // Creates an organic audio-frequency simulation logic tree pattern
                        let baseMult = Math.sin(Date.now() * 0.005 + index) * 15;
                        let randomKick = Math.floor(Math.random() * 25);
                        let calculatedHeight = Math.max(4, Math.abs(baseMult) + randomKick);
                        
                        bar.style.height = `${calculatedHeight}px`;
                    });
                } else {
                    waveBars.forEach(bar => bar.style.height = '3px');
                }
            }, 75); // Extreme fast responsiveness updates
        }

        audio.play().then(() => {
            body.classList.add('activated');
            startWaveAnimation();
        }).catch(() => {
            console.log("Autoplay context initialization blocked by engine framework rules.");
        });

        body.addEventListener('click', activatePage);

        // DISCORD SEAMLESS CLIPBOARD MODULE
        const discordBtn = document.getElementById('discord-btn');
        const discordText = document.getElementById('discord-text');

        discordBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            activatePage();

            navigator.clipboard.writeText(discordUsername).then(() => {
                discordText.textContent = "Copied!";
                discordText.classList.add('copied-flash');

                setTimeout(() => {
                    discordText.textContent = "Discord";
                    discordText.classList.remove('copied-flash');
                }, 2000);
            }).catch(err => {
                console.error('Error writing to system environment clipboard context', err);
            });
        });
    </script>

</body>
</html>
