<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexter334-gov</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            width: 100vw;
            min-height: 100vh;
            cursor: pointer;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* HARDTEKK DISTORTION OVERLAY */
        body::before {
            content: "";
            position: fixed;
            top: -50px;
            left: -50px;
            right: -50px;
            bottom: -50px;
            background-image: url('Airbrush-IMAGE-ENHANCER-1786522159771-1786522159771.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.12; /* Muted texture depth so it stays dark and gritty */
            z-index: 1;
            pointer-events: none;
        }

        /* Glitch distortion loop animation triggered on page click */
        body.activated::before {
            animation: tekkGlitch 0.25s infinite linear;
        }

        @keyframes tekkGlitch {
            0% { transform: translate(0, 0) skewX(0deg); filter: contrast(100%); }
            20% { transform: translate(-5px, 3px) skewX(2deg); filter: contrast(150%); }
            40% { transform: translate(4px, -2px) skewX(-1deg); }
            60% { transform: translate(-3px, -4px) opacity: 0.18; }
            80% { transform: translate(5px, 5px) skewX(1deg); filter: contrast(120%); }
            100% { transform: translate(0, 0) skewX(0deg); }
        }
        
        /* Top Header Banner styling */
        .banner-container {
            width: 100%;
            display: flex;
            justify-content: center; 
            background-color: #000000;
            position: relative;
            z-index: 2;
        }
        .banner-img {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
        }

        /* Container spanning the entire width of the page */
        .icon-stack {
            width: 100%;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 45px;
            position: relative;
            z-index: 2;
        }

        /* The row structure containing icon + text */
        .social-row {
            display: flex;
            align-items: center;
            justify-content: center; /* Starts perfectly centered */
            width: 100%;
            max-width: 800px; /* Aligns comfortably with the Neo banner borders */
            text-decoration: none;
            transition: transform 0.25s ease, justify-content 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .social-row:hover {
            transform: scale(1.05);
        }

        /* Custom image icon dimensions */
        .custom-icon {
            width: 55px;
            height: auto;
            display: block;
        }

        /* Muted gray text formatting */
        .social-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #444444; 
            margin-left: 0;
            opacity: 0;
            width: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: opacity 0.6s ease 0.2s, margin-left 0.5s cubic-bezier(0.25, 1, 0.5, 1), width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* KICK OFF ACTIVATION: Forces icons all the way to the far left border */
        body.activated .social-row {
            justify-content: flex-start;
        }

        body.activated .social-text {
            width: 150px;       
            margin-left: 20px;  
            opacity: 1;         
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Top Header Banner -->
    <div class="banner-container">
        <img src="ChatGPT%20Image%20Aug%2012,%202026,%2003_37_01%20AM.png" alt="Neo Banner" class="banner-img">
    </div>

    <!-- Clickable Custom Image Rows -->
    <div class="icon-stack">

        <!-- DISCORD BLOCK -->
        <a href="#" target="_blank" class="social-row" title="Discord">
            <img src="image-removebg-preview.png" alt="Discord" class="custom-icon">
            <span class="social-text">Discord</span>
        </a>

        <!-- INSTAGRAM BLOCK -->
        <a href="#" target="_blank" class="social-row" title="Instagram">
            <img src="image-removebg-preview%20(1).png" alt="Instagram" class="custom-icon">
            <span class="social-text">Instagram</span>
        </a>

        <!-- ROBLOX BLOCK -->
        <a href="#" target="_blank" class="social-row" title="Roblox">
            <img src="image-removebg-preview%20(2).png" alt="Roblox" class="custom-icon">
            <span class="social-text">Roblox</span>
        </a>

    </div>

    <!-- Hidden Background Audio Player -->
    <audio id="bg-audio" autoplay loop>
        <source src="ACIDTEKK%20(Slowed).mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-audio');
        const body = document.body;

        function activatePage() {
            if (!body.classList.contains('activated')) {
                body.classList.add('activated');
            }
            if (audio.paused) {
                audio.play();
            }
        }

        audio.play().then(() => {
            body.classList.add('activated');
        }).catch(() => {
            console.log("Autoplay blocked. Waiting for visitor click.");
        });

        body.addEventListener('click', activatePage);
    </script>

</body>
</html>
