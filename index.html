<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexter334-gov</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            width: 100vw;
            min-height: 100vh;
            cursor: pointer;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* STATIC GRIT / TEXTURE OVERLAY */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('Airbrush-IMAGE-ENHANCER-1786522159771-1786522159771.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: 1;
            pointer-events: none;
        }
        
        /* Main alignment container */
        .main-layout {
            width: 100%;
            max-width: 800px;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            gap: 60px; /* Space between links and bottom terminal */
            position: relative;
            z-index: 2;
        }

        /* Container for the left vertical stack of links */
        .icon-stack {
            display: flex;
            flex-direction: column;
            gap: 45px;
            width: 100%;
        }

        .social-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-decoration: none;
            transition: transform 0.25s ease;
        }
        
        .social-row:hover {
            transform: scale(1.05);
        }

        .custom-icon {
            width: 55px;
            height: auto;
            display: block;
        }

        .social-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #444444; 
            margin-left: 0;
            opacity: 0;
            width: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: opacity 0.6s ease 0.2s, margin-left 0.5s cubic-bezier(0.25, 1, 0.5, 1), width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        body.activated .social-row {
            justify-content: flex-start;
        }

        body.activated .social-text {
            width: 150px;      
            margin-left: 20px;  
            opacity: 1;         
        }

        .social-text.copied-flash {
            color: #00ff66 !important;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        /* BORDERLESS BOTTOM TERMINAL STYLING */
        .terminal-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            color: #555555;
            margin-top: auto; /* Pushes the text toward the bottom */
            background: transparent; /* No box outline */
            border: none;
            padding: 0;
            box-shadow: none;
        }

        .terminal-header {
            color: #333333;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding-bottom: 5px;
        }

        .terminal-logs {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-line {
            white-space: pre-wrap;
            opacity: 0;
            transform: translateY(3px);
            animation: lineFadeIn 0.3s forwards ease;
        }

        @keyframes lineFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .log-accent { color: #888888; }
        .log-success { color: #009944; }
        .log-warn { color: #aa7700; }

        /* LIVE CANVAS AUDIO VISUALIZER WAVE */
        .visualizer-container {
            width: 100%;
            height: 60px; /* Taller area for clean waves */
            margin-top: 15px;
            display: block;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        audio { display: none; }
    </style>
</head>
<body>

    <div class="main-layout">

        <!-- Top: Navigation Stack -->
        <div class="icon-stack">
            <!-- DISCORD -->
            <div class="social-row" id="discord-btn" title="Click to copy username">
                <img src="image-removebg-preview.png" alt="Discord" class="custom-icon">
                <span class="social-text" id="discord-text">Discord</span>
            </div>

            <!-- INSTAGRAM -->
            <a href="https://instagram.com" target="_blank" class="social-row" id="insta-btn" title="Instagram">
                <img src="image-removebg-preview%20(1).png" alt="Instagram" class="custom-icon">
                <span class="social-text">Instagram</span>
            </a>

            <!-- ROBLOX -->
            <a href="https://roblox.com" target="_blank" class="social-row" id="roblox-btn" title="Roblox">
                <img src="image-removebg-preview%20(2).png" alt="Roblox" class="custom-icon">
                <span class="social-text">Roblox</span>
            </a>
        </div>

        <!-- Towards the Bottom: Borderless Terminal System -->
        <div class="terminal-box">
            <div class="terminal-header">
                <span>SYS_LOG // MAIN</span>
                <span class="log-success">ONLINE</span>
            </div>
            
            <div class="terminal-logs" id="terminal-logs-box">
                <div class="log-line">> System initialized. Awaiting confirmation...</div>
                <div class="log-line log-warn">> [TAP SCREEN TO INITIALIZE AUDIO ENGINE]</div>
            </div>

            <!-- Canvas render target for actual reactive audio tracking waves -->
            <div class="visualizer-container">
                <canvas id="visualizer-canvas"></canvas>
            </div>
        </div>

    </div>

    <!-- Background Audio Engine -->
    <audio id="bg-audio" autoplay loop crossorigin="anonymous">
        <source src="ACIDTEKK%20(Slowed).mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-audio');
        const body = document.body;
        const logsBox = document.getElementById('terminal-logs-box');
        
        const canvas = document.getElementById('visualizer-canvas');
        const canvasCtx = canvas.getContext('2d');

        const discordUsername = "dextermogger0746";
        let audioContext, analyser, source, dataArray, bufferLength;
        let isInitialized = false;

        function addLog(text, className = '') {
            const line = document.createElement('div');
            line.className = `log-line ${className}`;
            line.innerHTML = `> ${text}`;
            logsBox.appendChild(line);
        }

        // Setup real web audio API connection tracking
        function setupAudioAnalysis() {
            if (isInitialized) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                
                analyser.fftSize = 64; // Fast rendering size
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                // Set canvas internal scale properties accurately
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                
                isInitialized = true;
                drawVisualizer();
            } catch (e) {
                console.log("Audio analysis engine failed init context", e);
            }
        }

        function activatePage() {
            if (!body.classList.contains('activated')) {
                body.classList.add('activated');
                setupAudioAnalysis();
                
                setTimeout(() => addLog("Access verified. Initializing system...", "log-accent"), 200);
                setTimeout(() => addLog("Loading asset: ACIDTEKK (Slowed).mp3...", "log-accent"), 600);
                
                audio.play().then(() => {
                    setTimeout(() => addLog("Playback active: ACIDTEKK stream processing.", "log-success"), 1100);
                }).catch(() => {
                    setTimeout(() => addLog("Playback blocked by security constraints.", "log-warn"), 1100);
                });
            } else {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                if (audio.paused) audio.play();
            }
        }

        // Live frame renderer algorithm making green bars step to the music frequencies
        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            if (!isInitialized) return;

            analyser.getByteFrequencyData(dataArray);
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 1.4;
            let barHeight;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
