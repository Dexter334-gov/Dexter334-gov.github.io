<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexter334-gov</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000; /* Pitch black matches your banner */
            width: 100vw;
            min-height: 100vh;
            cursor: pointer;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Top Header Banner styling */
        .banner-container {
            width: 100%;
            display: flex;
            justify-content: center; 
            background-color: #000000;
        }
        .banner-img {
            width: 100%;
            max-width: 800px;
            height: auto;
            display: block;
        }

        /* Container for the vertical stack of custom image icons */
        .icon-stack {
            width: 100%;
            max-width: 400px;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 45px; /* Spacing between your icons */
        }

        /* Style for the clickable icon image wrapper */
        .icon-link {
            text-decoration: none;
            transition: transform 0.25s ease, filter 0.25s ease;
            display: inline-block;
        }

        /* Custom image dimension constraints */
        .custom-icon {
            width: 55px;  /* Clean size for readability */
            height: auto;
            display: block;
        }

        /* Hover action: smooth scaling bounce */
        .icon-link:hover {
            transform: scale(1.15);
        }
        
        /* Adds a neat dark aesthetic brightness pop when hovered */
        .icon-link:active {
            transform: scale(0.95);
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Top Header Banner -->
    <div class="banner-container">
        <img src="ChatGPT%20Image%20Aug%2012,%202026,%2003_37_01%20AM.png" alt="Neo Banner" class="banner-img">
    </div>

    <!-- Clickable Custom Image Icons Stack -->
    <div class="icon-stack">

        <!-- DISCORD LINK -->
        <a href="#" target="_blank" class="icon-link" title="Discord">
            <img src="image-removebg-preview.png" alt="Discord" class="custom-icon">
        </a>

        <!-- INSTAGRAM LINK -->
        <a href="#" target="_blank" class="icon-link" title="Instagram">
            <img src="image-removebg-preview%20(1).png" alt="Instagram" class="custom-icon">
        </a>

        <!-- ROBLOX LINK -->
        <a href="#" target="_blank" class="icon-link" title="Roblox">
            <img src="image-removebg-preview%20(2).png" alt="Roblox" class="custom-icon">
        </a>

    </div>

    <!-- Hidden Background Audio Player -->
    <audio id="bg-audio" autoplay loop>
        <source src="ACIDTEKK%20(Slowed).mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-audio');
        audio.play().catch(() => {
            console.log("Autoplay blocked. Awaiting screen click.");
        });
        document.body.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
            }
        });
    </script>

</body>
</html>
