<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexter334-gov</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000; /* Pitch black matches the banner perfectly */
            width: 100vw;
            min-height: 100vh;
            cursor: pointer;
            overflow-x: hidden;
        }
        
        /* Container that keeps the image perfectly centered */
        .banner-container {
            width: 100%;
            display: flex;
            justify-content: center; 
            background-color: #000000;
        }

        .banner-img {
            width: 100%;
            max-width: 1200px; /* Prevents it from scaling up too large and losing quality */
            height: auto;       /* Keeps original crisp proportions */
            display: block;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Center-aligned banner with the exact updated file path -->
    <div class="banner-container">
        <img src="ChatGPT%20Image%20Aug%2012,%202026,%2003_37_01%20AM.png" alt="Neo Banner" class="banner-img">
    </div>

    <!-- Hidden Audio File -->
    <audio id="bg-audio" autoplay loop>
        <source src="ACIDTEKK%20(Slowed).mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-audio');

        audio.play().catch(() => {
            console.log("Browser blocked autoplay. Waiting for user to click the screen.");
        });

        document.body.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
            }
        });
    </script>

</body>
</html>
